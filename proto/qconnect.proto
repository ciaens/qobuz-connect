syntax = "proto3";

package qconnect;

enum BufferState {
  BUFFER_STATE_UNKNOWN = 0;
  BUFFER_STATE_BUFFERING = 1;
  BUFFER_STATE_OK = 2;
  BUFFER_STATE_ERROR = 3;
  BUFFER_STATE_UNDERRUN = 4;
}

enum PlayingState {
  PLAYING_STATE_UNKNOWN = 0;
  PLAYING_STATE_STOPPED = 1;
  PLAYING_STATE_PLAYING = 2;
  PLAYING_STATE_PAUSED = 3;
}

enum LoopMode {
  LOOP_MODE_UNKNOWN = 0;
  LOOP_MODE_OFF = 1;
  LOOP_MODE_REPEAT_ONE = 2;
  LOOP_MODE_REPEAT_ALL = 3;
}

enum AudioQuality {
  AUDIO_QUALITY_UNKNOWN = 0;
  AUDIO_QUALITY_MP3 = 1;
  AUDIO_QUALITY_CD = 2;
  AUDIO_QUALITY_HIRES_LEVEL1 = 3;
  AUDIO_QUALITY_HIRES_LEVEL2 = 4;
  AUDIO_QUALITY_HIRES_LEVEL3 = 5;
}

enum DeviceType {
  DEVICE_TYPE_UNKNOWN = 0;
  DEVICE_TYPE_SPEAKER = 1;
  DEVICE_TYPE_STREAMER = 2;
  DEVICE_TYPE_TV = 3;
  DEVICE_TYPE_SOUNDBAR = 4;
  DEVICE_TYPE_COMPUTER = 5;
  DEVICE_TYPE_MOBILE = 6;
  DEVICE_TYPE_CAST = 7;
  DEVICE_TYPE_HEADPHONES = 8;
  DEVICE_TYPE_TABLET = 9;
}

enum VolumeRemoteControl {
  VOLUME_REMOTE_CONTROL_UNKNOWN = 0;
  VOLUME_REMOTE_CONTROL_NOT_ALLOWED = 1;
  VOLUME_REMOTE_CONTROL_ALLOWED = 2;
}

enum NetworkType {
  NETWORK_TYPE_UNKNOWN = 0;
  NETWORK_TYPE_WIFI = 1;
  NETWORK_TYPE_CELLULAR = 2;
}

enum ErrorType {
  ERROR_TYPE_UNKNOWN = 0;
  ERROR_TYPE_TRACK_NOT_FOUND = 1;
  ERROR_TYPE_TRACK_NOT_STREAMABLE = 2;
  ERROR_TYPE_TRACK_MUSIC_DATA_INVALID = 3;
  ERROR_TYPE_SERVICE_ERROR = 4;
  ERROR_TYPE_NETWORK_ERROR = 5;
  ERROR_TYPE_OTHER_ERRORS = 100;
}

enum RendererStatus {
  RENDERER_STATUS_UNKNOWN = 0;
  RENDERER_STATUS_ACTIVE_CONNECTED = 1;
  RENDERER_STATUS_ACTIVE_DISCONNECTED = 2;
  RENDERER_STATUS_INACTIVE = 3;
}

enum JoinSessionReason {
  JOIN_SESSION_REASON_UNKNOWN = 0;
  JOIN_SESSION_REASON_CONTROLLER_REQUEST = 1;
  JOIN_SESSION_REASON_RECONNECTION = 2;
}

enum ActionType {
  ACTION_TYPE_UNKNOWN = 0;
  ACTION_TYPE_PREVIOUS = 1;
  ACTION_TYPE_NEXT = 2;
  ACTION_TYPE_REPEAT_OFF = 3;
  ACTION_TYPE_REPEAT_ONE = 4;
  ACTION_TYPE_REPEAT_ALL = 5;
  ACTION_TYPE_SHUFFLE_OFF = 6;
  ACTION_TYPE_SHUFFLE_ON = 7;
  ACTION_TYPE_SEEK = 8;
}

enum MessageType {
  MESSAGE_TYPE_UNKNOWN = 0;
  MESSAGE_TYPE_ERROR = 1;
  MESSAGE_TYPE_PLAYBACK_ERROR = 2;
  MESSAGE_TYPE_AUTHENTICATE = 3;
  MESSAGE_TYPE_RNDR_SRVR_JOIN_SESSION = 21;
  MESSAGE_TYPE_RNDR_SRVR_DEVICE_INFO_UPDATED = 22;
  MESSAGE_TYPE_RNDR_SRVR_STATE_UPDATED = 23;
  MESSAGE_TYPE_RNDR_SRVR_RENDERER_ACTION = 24;
  MESSAGE_TYPE_RNDR_SRVR_VOLUME_CHANGED = 25;
  MESSAGE_TYPE_RNDR_SRVR_FILE_AUDIO_QUALITY_CHANGED = 26;
  MESSAGE_TYPE_RNDR_SRVR_DEVICE_AUDIO_QUALITY_CHANGED = 27;
  MESSAGE_TYPE_RNDR_SRVR_MAX_AUDIO_QUALITY_CHANGED = 28;
  MESSAGE_TYPE_RNDR_SRVR_VOLUME_MUTED = 29;
  MESSAGE_TYPE_SRVR_RNDR_SET_STATE = 41;
  MESSAGE_TYPE_SRVR_RNDR_SET_VOLUME = 42;
  MESSAGE_TYPE_SRVR_RNDR_SET_ACTIVE = 43;
  MESSAGE_TYPE_SRVR_RNDR_SET_MAX_AUDIO_QUALITY = 44;
  MESSAGE_TYPE_SRVR_RNDR_SET_LOOP_MODE = 45;
  MESSAGE_TYPE_SRVR_RNDR_SET_SHUFFLE_MODE = 46;
  MESSAGE_TYPE_SRVR_RNDR_MUTE_VOLUME = 47;
  MESSAGE_TYPE_CTRL_SRVR_JOIN_SESSION = 61;
  MESSAGE_TYPE_CTRL_SRVR_SET_PLAYER_STATE = 62;
  MESSAGE_TYPE_CTRL_SRVR_SET_ACTIVE_RENDERER = 63;
  MESSAGE_TYPE_CTRL_SRVR_SET_VOLUME = 64;
  MESSAGE_TYPE_CTRL_SRVR_CLEAR_QUEUE = 65;
  MESSAGE_TYPE_CTRL_SRVR_QUEUE_LOAD_TRACKS = 66;
  MESSAGE_TYPE_CTRL_SRVR_QUEUE_INSERT_TRACKS = 67;
  MESSAGE_TYPE_CTRL_SRVR_QUEUE_ADD_TRACKS = 68;
  MESSAGE_TYPE_CTRL_SRVR_QUEUE_REMOVE_TRACKS = 69;
  MESSAGE_TYPE_CTRL_SRVR_QUEUE_REORDER_TRACKS = 70;
  MESSAGE_TYPE_CTRL_SRVR_SET_SHUFFLE_MODE = 71;
  MESSAGE_TYPE_CTRL_SRVR_SET_LOOP_MODE = 72;
  MESSAGE_TYPE_CTRL_SRVR_MUTE_VOLUME = 73;
  MESSAGE_TYPE_CTRL_SRVR_SET_MAX_AUDIO_QUALITY = 74;
  MESSAGE_TYPE_CTRL_SRVR_SET_QUEUE_STATE = 75;
  MESSAGE_TYPE_CTRL_SRVR_ASK_FOR_QUEUE_STATE = 76;
  MESSAGE_TYPE_CTRL_SRVR_ASK_FOR_RENDERER_STATE = 77;
  MESSAGE_TYPE_CTRL_SRVR_SET_AUTOPLAY_MODE = 78;
  MESSAGE_TYPE_CTRL_SRVR_AUTOPLAY_LOAD_TRACKS = 79;
  MESSAGE_TYPE_CTRL_SRVR_AUTOPLAY_REMOVE_TRACKS = 80;
  MESSAGE_TYPE_SRVR_CTRL_SESSION_STATE = 81;
  MESSAGE_TYPE_SRVR_CTRL_RENDERER_STATE_UPDATED = 82;
  MESSAGE_TYPE_SRVR_CTRL_ADD_RENDERER = 83;
  MESSAGE_TYPE_SRVR_CTRL_UPDATE_RENDERER = 84;
  MESSAGE_TYPE_SRVR_CTRL_REMOVE_RENDERER = 85;
  MESSAGE_TYPE_SRVR_CTRL_ACTIVE_RENDERER_CHANGED = 86;
  MESSAGE_TYPE_SRVR_CTRL_VOLUME_CHANGED = 87;
  MESSAGE_TYPE_SRVR_CTRL_QUEUE_ERROR_MESSAGE = 88;
  MESSAGE_TYPE_SRVR_CTRL_QUEUE_CLEARED = 89;
  MESSAGE_TYPE_SRVR_CTRL_QUEUE_STATE = 90;
  MESSAGE_TYPE_SRVR_CTRL_QUEUE_TRACKS_LOADED = 91;
  MESSAGE_TYPE_SRVR_CTRL_QUEUE_TRACKS_INSERTED = 92;
  MESSAGE_TYPE_SRVR_CTRL_QUEUE_TRACKS_ADDED = 93;
  MESSAGE_TYPE_SRVR_CTRL_QUEUE_TRACKS_REMOVED = 94;
  MESSAGE_TYPE_SRVR_CTRL_QUEUE_TRACKS_REORDERED = 95;
  MESSAGE_TYPE_SRVR_CTRL_SHUFFLE_MODE_SET = 96;
  MESSAGE_TYPE_SRVR_CTRL_LOOP_MODE_SET = 97;
  MESSAGE_TYPE_SRVR_CTRL_VOLUME_MUTED = 98;
  MESSAGE_TYPE_SRVR_CTRL_MAX_AUDIO_QUALITY_CHANGED = 99;
  MESSAGE_TYPE_SRVR_CTRL_FILE_AUDIO_QUALITY_CHANGED = 100;
  MESSAGE_TYPE_SRVR_CTRL_DEVICE_AUDIO_QUALITY_CHANGED = 101;
  MESSAGE_TYPE_SRVR_CTRL_AUTOPLAY_MODE_SET = 102;
  MESSAGE_TYPE_SRVR_CTRL_AUTOPLAY_TRACKS_LOADED = 103;
  MESSAGE_TYPE_SRVR_CTRL_AUTOPLAY_TRACKS_REMOVED = 104;
  MESSAGE_TYPE_SRVR_CTRL_QUEUE_TRACKS_ADDED_FROM_AUTOPLAY = 105;
}

message Error {
  string code = 1;
  string message = 2;
}

message PlaybackError {
  QueueVersion queue_version = 1;
  int32 queue_item_id = 2;
  ErrorType error_type = 3;
}

message AuthenticateMessage {
  string token = 1;
}

message DeviceCapabilities {
  AudioQuality min_audio_quality = 1;
  AudioQuality max_audio_quality = 2;
  VolumeRemoteControl volume_remote_control = 3;
}

message DeviceInfo {
  bytes device_uuid = 1;
  string friendly_name = 2;
  string brand = 3;
  string model = 4;
  string serial_number = 5;
  DeviceType type = 6;
  DeviceCapabilities capabilities = 7;
  string software_version = 8;
}

message Position {
  fixed64 timestamp = 1;
  uint32 value = 2;
}

message QueueVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message QueueTrack {
  int32 queue_item_id = 1;
  fixed32 track_id = 2;
}

message QueueTrackRef {
  int32 queue_item_id = 1;
  fixed32 track_id = 2;
  optional bytes context_uuid = 3;
}

message CtrlSrvrJoinSession {
  optional bytes session_uuid = 1;
  DeviceInfo device_info = 2;
}

message CtrlSrvrSetPlayerState {
  optional PlayingState playing_state = 1;
  optional uint32 current_position = 2;
  QueueItemRef current_queue_item = 3;
}

message QueueItemRef {
  QueueVersion queue_version = 1;
  int32 id = 2;
}

message CtrlSrvrSetActiveRenderer {
  int32 renderer_id = 1;
}

message CtrlSrvrSetVolume {
  int32 renderer_id = 1;
  optional uint32 volume = 2;
  optional int32 volume_delta = 3;
}

message CtrlSrvrMuteVolume {
  int32 renderer_id = 1;
  bool value = 2;
}

message CtrlSrvrSetLoopMode {
  LoopMode loop_mode = 1;
}

message CtrlSrvrSetAutoplayMode {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  bool autoplay_mode = 3;
  bool autoplay_reset = 4;
  bool autoplay_loading = 5;
}

message CtrlSrvrSetMaxAudioQuality {
  int32 renderer_id = 1;
  AudioQuality max_audio_quality = 2;
}

message SrvrCtrlMaxAudioQualityChanged {
  int32 renderer_id = 1;
  AudioQuality max_audio_quality = 2;
  optional NetworkType network_type = 3;
}

message SrvrCtrlFileAudioQualityChanged {
  int32 renderer_id = 1;
  uint32 sampling_rate = 2;
  uint32 bit_depth = 3;
  uint32 nb_channels = 4;
  AudioQuality audio_quality = 5;
}

message SrvrCtrlDeviceAudioQualityChanged {
  int32 renderer_id = 1;
  uint32 sampling_rate = 2;
  uint32 bit_depth = 3;
  uint32 nb_channels = 4;
}

message CtrlSrvrAskForRendererState {
  int32 renderer_id = 1;
}

message CtrlSrvrAskForQueueState {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
}

message CtrlSrvrSetQueueState {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  repeated TrackRef tracks = 3;
  bool shuffle_mode = 4;
  repeated uint32 shuffled_track_indexes = 5;
  bool autoplay_mode = 6;
  bool autoplay_loading = 7;
  repeated TrackRef autoplay_tracks = 8;
}

message TrackRef {
  fixed32 track_id = 1;
  bytes context_uuid = 2;
}

message CtrlSrvrClearQueue {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
}

message CtrlSrvrQueueLoadTracks {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  repeated fixed32 track_ids = 3;
  uint32 queue_position = 4;
  optional fixed32 shuffle_seed = 5;
  optional int32 shuffle_pivot_index = 6;
  optional bool shuffle_mode = 7;
  bytes context_uuid = 8;
  bool autoplay_reset = 9;
  bool autoplay_loading = 10;
}

message CtrlSrvrQueueInsertTracks {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  repeated fixed32 track_ids = 3;
  optional int32 insert_after = 4;
  optional fixed32 shuffle_seed = 5;
  bytes context_uuid = 6;
  bool autoplay_reset = 7;
  bool autoplay_loading = 8;
}

message CtrlSrvrQueueAddTracks {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  repeated fixed32 track_ids = 3;
  optional fixed32 shuffle_seed = 4;
  bytes context_uuid = 5;
  bool autoplay_reset = 6;
  bool autoplay_loading = 7;
}

message CtrlSrvrQueueRemoveTracks {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  repeated int32 queue_item_ids = 3;
  bool autoplay_reset = 4;
  bool autoplay_loading = 5;
}

message CtrlSrvrQueueReorderTracks {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  repeated int32 queue_item_ids = 3;
  optional int32 insert_after = 4;
  bool autoplay_reset = 5;
  bool autoplay_loading = 6;
}

message CtrlSrvrSetShuffleMode {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  bool shuffle_mode = 3;
  optional fixed32 shuffle_seed = 4;
  optional int32 shuffle_pivot_queue_item_id = 5;
  bool autoplay_reset = 6;
  bool autoplay_loading = 7;
}

message CtrlSrvrAutoplayLoadTracks {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  repeated fixed32 track_ids = 3;
  bytes context_uuid = 4;
}

message CtrlSrvrAutoplayRemoveTracks {
  QueueVersion queue_version_ref = 1;
  bytes action_uuid = 2;
  repeated int32 queue_item_ids = 3;
}

message SrvrCtrlSessionState {
  bytes session_uuid = 1;
  int32 active_renderer_id = 2;
  QueueVersion queue_version = 3;
  PlayingState playing_state = 4;
  LoopMode loop_mode = 5;
}

message SrvrCtrlRendererStateUpdated {
  int32 renderer_id = 1;
  RendererStatus status = 2;
  RendererState player_state = 3;
}

message RendererState {
  PlayingState playing_state = 1;
  BufferState buffer_state = 2;
  Position current_position = 3;
  uint32 duration = 4;
  int32 current_queue_item_id = 5;
}

message SrvrCtrlAddRenderer {
  int32 renderer_id = 1;
  DeviceInfo device_info = 2;
}

message SrvrCtrlUpdateRenderer {
  int32 renderer_id = 1;
  DeviceInfo device_info = 2;
}

message SrvrCtrlRemoveRenderer {
  int32 renderer_id = 1;
}

message SrvrCtrlActiveRendererChanged {
  int32 active_renderer_id = 1;
}

message SrvrCtrlVolumeChanged {
  int32 renderer_id = 1;
  uint32 volume = 2;
}

message SrvrCtrlVolumeMuted {
  int32 renderer_id = 1;
  bool value = 2;
}

message SrvrCtrlLoopModeSet {
  LoopMode loop_mode = 1;
}

message SrvrCtrlQueueState {
  QueueVersion queue_version = 1;
  optional bytes action_uuid = 2;
  repeated QueueTrackRef tracks = 3;
  bool shuffle_mode = 4;
  repeated uint32 shuffled_track_indexes = 5;
  bool autoplay_mode = 6;
  bool autoplay_loading = 7;
  repeated QueueTrackRef autoplay_tracks = 8;
  optional bytes queue_hash = 100;
}

message SrvrCtrlQueueCleared {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
}

message SrvrCtrlQueueTracksLoaded {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  repeated QueueTrack tracks = 3;
  uint32 queue_position = 4;
  optional fixed32 shuffle_seed = 5;
  optional int32 shuffle_pivot_queue_item_id = 6;
  optional bool shuffle_mode = 7;
  bytes context_uuid = 8;
  bool autoplay_reset = 9;
  bool autoplay_loading = 10;
  optional bytes queue_hash = 100;
}

message SrvrCtrlQueueTracksReordered {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  repeated int32 queue_item_ids = 3;
  optional int32 insert_after = 4;
  bool autoplay_reset = 5;
  bool autoplay_loading = 6;
  optional bytes queue_hash = 100;
}

message SrvrCtrlQueueTracksRemoved {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  repeated int32 queue_item_ids = 3;
  bool autoplay_reset = 4;
  bool autoplay_loading = 5;
  optional bytes queue_hash = 100;
}

message SrvrCtrlQueueTracksAdded {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  repeated QueueTrack tracks = 3;
  optional fixed32 shuffle_seed = 4;
  bytes context_uuid = 5;
  bool autoplay_reset = 6;
  bool autoplay_loading = 7;
  optional bytes queue_hash = 100;
}

message SrvrCtrlQueueTracksAddedFromAutoplay {
  QueueVersion queue_version = 1;
  repeated int32 queue_item_ids = 2;
  optional bytes queue_hash = 100;
}

message SrvrCtrlQueueTracksInserted {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  repeated QueueTrack tracks = 3;
  optional int32 insert_after = 4;
  optional fixed32 shuffle_seed = 5;
  bytes context_uuid = 6;
  bool autoplay_reset = 7;
  bool autoplay_loading = 8;
  optional bytes queue_hash = 100;
}

message SrvrCtrlShuffleModeSet {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  bool shuffle_mode = 3;
  optional fixed32 shuffle_seed = 4;
  optional int32 shuffle_pivot_queue_item_id = 5;
  bool autoplay_reset = 6;
  bool autoplay_loading = 7;
  optional bytes queue_hash = 100;
}

message SrvrCtrlAutoplayModeSet {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  bool autoplay_mode = 3;
  bool autoplay_reset = 4;
  bool autoplay_loading = 5;
}

message SrvrCtrlAutoplayTracksLoaded {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  repeated QueueTrack tracks = 3;
  bytes context_uuid = 4;
}

message SrvrCtrlAutoplayTracksRemoved {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  repeated int32 queue_item_ids = 3;
}

message SrvrCtrlQueueErrorMessage {
  QueueVersion queue_version = 1;
  bytes action_uuid = 2;
  Error error = 3;
}

message RndrSrvrJoinSession {
  bytes session_uuid = 1;
  DeviceInfo device_info = 2;
  JoinSessionReason reason = 3;
  QueueRendererState initial_state = 4;
  optional bool is_active = 5;
}

message RndrSrvrDeviceInfoUpdated {
  DeviceInfo device_info = 1;
}

message RndrSrvrStateUpdated {
  QueueRendererState state = 1;
}

message RndrSrvrRendererAction {
  optional uint32 seek_position = 1;
  ActionType action = 2;
}

message RndrSrvrVolumeChanged {
  uint32 volume = 1;
}

message RndrSrvrVolumeMuted {
  bool value = 1;
}

message RndrSrvrMaxAudioQualityChanged {
  AudioQuality max_audio_quality = 1;
  optional NetworkType network_type = 2;
}

message RndrSrvrFileAudioQualityChanged {
  uint32 sampling_rate = 1;
  uint32 bit_depth = 2;
  uint32 nb_channels = 3;
  AudioQuality audio_quality = 4;
}

message RndrSrvrDeviceAudioQualityChanged {
  uint32 sampling_rate = 1;
  uint32 bit_depth = 2;
  uint32 nb_channels = 3;
}

message SrvrRndrSetState {
  optional PlayingState playing_state = 1;
  optional uint32 current_position = 2;
  QueueVersion queue_version = 3;
  QueueTrackRef current_track = 4;
  QueueTrackRef next_track = 5;
}

message SrvrRndrSetVolume {
  optional uint32 volume = 1;
  optional int32 volume_delta = 2;
}

message SrvrRndrMuteVolume {
  bool value = 1;
}

message SrvrRndrSetMaxAudioQuality {
  AudioQuality max_audio_quality = 1;
}

message SrvrRndrSetLoopMode {
  LoopMode loop_mode = 1;
}

message SrvrRndrSetShuffleMode {
  bool shuffle_mode = 1;
}

message SrvrRndrSetActive {
  bool active = 1;
}

message QueueRendererState {
  PlayingState playing_state = 1;
  BufferState buffer_state = 2;
  Position current_position = 3;
  uint32 duration = 4;
  QueueVersion queue_version = 5;
  int32 current_queue_item_id = 6;
  int32 next_queue_item_id = 7;
}

message QConnectBatch {
  fixed64 messages_time = 1;
  int32 messages_id = 2;
  repeated QConnectMessage messages = 3;
}

message QConnectMessage {
  MessageType message_type = 1;
  Error error = 2;
  PlaybackError playback_error = 3;
  AuthenticateMessage authenticate = 4;
  RndrSrvrJoinSession rndr_srvr_join_session = 21;
  RndrSrvrDeviceInfoUpdated rndr_srvr_device_info_updated = 22;
  RndrSrvrStateUpdated rndr_srvr_state_updated = 23;
  RndrSrvrRendererAction rndr_srvr_renderer_action = 24;
  RndrSrvrVolumeChanged rndr_srvr_volume_changed = 25;
  RndrSrvrFileAudioQualityChanged rndr_srvr_file_audio_quality_changed = 26;
  RndrSrvrDeviceAudioQualityChanged rndr_srvr_device_audio_quality_changed = 27;
  RndrSrvrMaxAudioQualityChanged rndr_srvr_max_audio_quality_changed = 28;
  RndrSrvrVolumeMuted rndr_srvr_volume_muted = 29;
  SrvrRndrSetState srvr_rndr_set_state = 41;
  SrvrRndrSetVolume srvr_rndr_set_volume = 42;
  SrvrRndrSetActive srvr_rndr_set_active = 43;
  SrvrRndrSetMaxAudioQuality srvr_rndr_set_max_audio_quality = 44;
  SrvrRndrSetLoopMode srvr_rndr_set_loop_mode = 45;
  SrvrRndrSetShuffleMode srvr_rndr_set_shuffle_mode = 46;
  SrvrRndrMuteVolume srvr_rndr_mute_volume = 47;
  CtrlSrvrJoinSession ctrl_srvr_join_session = 61;
  CtrlSrvrSetPlayerState ctrl_srvr_set_player_state = 62;
  CtrlSrvrSetActiveRenderer ctrl_srvr_set_active_renderer = 63;
  CtrlSrvrSetVolume ctrl_srvr_set_volume = 64;
  CtrlSrvrClearQueue ctrl_srvr_clear_queue = 65;
  CtrlSrvrQueueLoadTracks ctrl_srvr_queue_load_tracks = 66;
  CtrlSrvrQueueInsertTracks ctrl_srvr_queue_insert_tracks = 67;
  CtrlSrvrQueueAddTracks ctrl_srvr_queue_add_tracks = 68;
  CtrlSrvrQueueRemoveTracks ctrl_srvr_queue_remove_tracks = 69;
  CtrlSrvrQueueReorderTracks ctrl_srvr_queue_reorder_tracks = 70;
  CtrlSrvrSetShuffleMode ctrl_srvr_set_shuffle_mode = 71;
  CtrlSrvrSetLoopMode ctrl_srvr_set_loop_mode = 72;
  CtrlSrvrMuteVolume ctrl_srvr_mute_volume = 73;
  CtrlSrvrSetMaxAudioQuality ctrl_srvr_set_max_audio_quality = 74;
  CtrlSrvrSetQueueState ctrl_srvr_set_queue_state = 75;
  CtrlSrvrAskForQueueState ctrl_srvr_ask_for_queue_state = 76;
  CtrlSrvrAskForRendererState ctrl_srvr_ask_for_renderer_state = 77;
  CtrlSrvrSetAutoplayMode ctrl_srvr_set_autoplay_mode = 78;
  CtrlSrvrAutoplayLoadTracks ctrl_srvr_autoplay_load_tracks = 79;
  CtrlSrvrAutoplayRemoveTracks ctrl_srvr_autoplay_remove_tracks = 80;
  SrvrCtrlSessionState srvr_ctrl_session_state = 81;
  SrvrCtrlRendererStateUpdated srvr_ctrl_renderer_state_updated = 82;
  SrvrCtrlAddRenderer srvr_ctrl_add_renderer = 83;
  SrvrCtrlUpdateRenderer srvr_ctrl_update_renderer = 84;
  SrvrCtrlRemoveRenderer srvr_ctrl_remove_renderer = 85;
  SrvrCtrlActiveRendererChanged srvr_ctrl_active_renderer_changed = 86;
  SrvrCtrlVolumeChanged srvr_ctrl_volume_changed = 87;
  SrvrCtrlQueueErrorMessage srvr_ctrl_queue_error_message = 88;
  SrvrCtrlQueueCleared srvr_ctrl_queue_cleared = 89;
  SrvrCtrlQueueState srvr_ctrl_queue_state = 90;
  SrvrCtrlQueueTracksLoaded srvr_ctrl_queue_tracks_loaded = 91;
  SrvrCtrlQueueTracksInserted srvr_ctrl_queue_tracks_inserted = 92;
  SrvrCtrlQueueTracksAdded srvr_ctrl_queue_tracks_added = 93;
  SrvrCtrlQueueTracksRemoved srvr_ctrl_queue_tracks_removed = 94;
  SrvrCtrlQueueTracksReordered srvr_ctrl_queue_tracks_reordered = 95;
  SrvrCtrlShuffleModeSet srvr_ctrl_shuffle_mode_set = 96;
  SrvrCtrlLoopModeSet srvr_ctrl_loop_mode_set = 97;
  SrvrCtrlVolumeMuted srvr_ctrl_volume_muted = 98;
  SrvrCtrlMaxAudioQualityChanged srvr_ctrl_max_audio_quality_changed = 99;
  SrvrCtrlFileAudioQualityChanged srvr_ctrl_file_audio_quality_changed = 100;
  SrvrCtrlDeviceAudioQualityChanged srvr_ctrl_device_audio_quality_changed = 101;
  SrvrCtrlAutoplayModeSet srvr_ctrl_autoplay_mode_set = 102;
  SrvrCtrlAutoplayTracksLoaded srvr_ctrl_autoplay_tracks_loaded = 103;
