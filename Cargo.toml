[package]
name = "qobuz-connect"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Qobuz Connect protocol for renderers and controllers"
license = "MIT"
repository = "https://github.com/ciaens/qobuz-connect"
keywords = ["qobuz", "connect", "protobuf", "websocket", "audio"]
categories = ["network-programming", "multimedia::audio"]
readme = "README.md"
exclude = ["/tools", "/docs", "/.github"]

[features]
discovery = ["dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:mdns-sd"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "lan"
required-features = ["discovery"]

[dependencies]
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
mdns-sd = { version = "0.21", optional = true }
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "warn"
dbg_macro = "warn"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
